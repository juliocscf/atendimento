name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Non-secret dummy public configuration for anonymous smoke checks only.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Check out source without persisting the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.110.0

      - name: Install locked npm dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Start isolated local Supabase stack
        shell: bash
        run: |
          if ! supabase start --exclude realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Local Supabase startup failed. Output was withheld to avoid logging generated local credentials."
            exit 1
          fi

      - name: Lint local database schema
        run: supabase db lint --local

      - name: Run local database security tests
        run: supabase test db --local

      - name: Start application for anonymous security smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Application did not become ready for the smoke test."
            exit 1
          fi

      - name: Run anonymous security smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run security:smoke
